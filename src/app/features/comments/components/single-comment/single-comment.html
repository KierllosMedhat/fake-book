<div class="border-t border-slate-200 bg-[#f7f8fa] px-4 py-4">
  <div
    class="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2"
  >
    <div class="flex items-center gap-2">
      <p class="text-sm font-extrabold tracking-wide text-slate-700">Comments</p>
      <span class="rounded-full bg-[#e7f3ff] px-2 py-0.5 text-[11px] font-bold text-[#1877f2]"
        >1</span
      >
    </div>
  </div>
  <div class="space-y-2">
    @for (comment of commentList; track comment._id) {
      <div class="relative flex items-start gap-2">
      <img
       [alt]="comment.commentCreator.name"
        class="mt-0.5 h-8 w-8 rounded-full object-cover"
        [src]="comment.commentCreator.photo"
      />
      <div class="min-w-0 flex-1">
        <div class="relative inline-block max-w-full rounded-2xl bg-[#f0f2f5] px-3 py-2">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="text-xs font-bold text-slate-900">{{ comment.commentCreator.name }}</p>
              <p class="text-xs text-slate-500">{{ comment.commentCreator.username }}</p>
            </div>
          </div>
          <p class="mt-1 whitespace-pre-wrap text-sm text-slate-800">{{ comment.content }}</p>
        </div>
        <div class="mt-1.5 flex items-center justify-between px-1">
          <div class="flex items-center gap-4">
            <span class="text-xs font-semibold text-slate-400">{{ comment.createdAt | date: 'short' }}</span
            ><button
              (click)="likeComment(comment._id)"
              class="text-xs font-semibold hover:underline disabled:opacity-60 text-slate-500"
            >
              Like ({{ comment.likes.length }})
            </button>
          </div>
        </div>
      </div>
    </div>
    }
  </div>
</div>
